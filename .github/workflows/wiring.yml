name: wiring

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Sidebar / route / CTA wiring check
        run: bun run check:wiring
